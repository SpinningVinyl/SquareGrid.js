<!DOCTYPE html>

<html>

  <head>
    <title>SquareGrid demo</title>
    <script src="grid.js"></script>
  </head>


  <body>
    <p>Click to colour a cell.</p>
    <p>Alt+click to clear a cell.</p>
    <p>Ctrl+click to activate/deactivate a cell.</p>
    <div id="container"></div>
    <p>Current fill style: <span id="styleLabel">default</span></p>
    <button id="styleButton">Change fill style</button>
    <p>Current animation: <span id="animationsLabel">none</span></p>
    <button id="animationsButton">Change animations</button>
    <script>
      const myGrid = new SquareGrid(20, 10, 40, document.querySelector('#container'));
      myGrid.setGridColor('#777777');
      myGrid.setActiveColor('red');
      myGrid.setAlwaysDrawGrid(true);
      myGrid.setAnimation('none');

      const styleMap = new Map();
      styleMap.set(0, "default");
      styleMap.set(1, "diamond");
      styleMap.set(2, "circle");

      const animationsMap = new Map();
      animationsMap.set(0, "none");
      animationsMap.set(1, "fade");
      animationsMap.set(2, "expand");

      let currentStyle = 0;

      const styleBtn = document.querySelector('#styleButton');
      const styleLabel = document.querySelector('#styleLabel');
      styleBtn.onclick = () => {
          currentStyle += 1;
          if (currentStyle > 2) {
              currentStyle = 0;
          }
          const styleString = styleMap.get(currentStyle);
          styleLabel.innerText = styleString;
          myGrid.setFillStyle(styleString);
      }

      let currentAnimations = 0;
      
      const animationsBtn = document.querySelector('#animationsButton');
      const animationsLabel = document.querySelector('#animationsLabel');
      animationsBtn.onclick = () => {
          currentAnimations += 1;
          if (currentAnimations > 2) {
              currentAnimations = 0;
          }
          const animationsString = animationsMap.get(currentAnimations);
          animationsLabel.innerText = animationsString;
          myGrid.setAnimation(animationsString);
      }
      
      myGrid.setOnClickCallback((row, column, { altKey , ctrlKey }) => {
          if (altKey) {
              myGrid.clearCell(row, column);
          } else if (ctrlKey) {
              const activeCell = myGrid.getActiveCell();
              if (activeCell?.row === row && activeCell.column === column) {
                  myGrid.clearActiveCell();
              } else {
                  myGrid.setActiveCell(row, column);
              }              
          } else {
              myGrid.setCellColor(row, column, getRandomColor());    
          }
    
      });

      function getRandomColor() {
          const r = Math.floor(Math.random() * 256);
          const g = Math.floor(Math.random() * 256);
          const b = Math.floor(Math.random() * 256);
          return `rgb(${r}, ${g}, ${b})`;
      }
    </script>
  </body>
  
</html>
