<!doctype html>
<meta charset="utf-8">
<title>SquareGrid rendering checks</title>
<p>This page tests color validation once, and pixel-level rendering at several device pixel ratios.</p>
<script src="grid.js"></script>
<pre id="result"></pre>
<script>
function checkRedrawing() {
    const parent = document.createElement('div');
    const grid = new SquareGrid(2, 2, 20, parent);
    try {
        const canvas = parent.firstChild;
        const context = canvas.getContext('2d');
        const originalScale = context.getTransform().a;
        grid.setDefaultColor('red');
        grid.setCellColor(1, 1, 'black');
        grid.setDefaultColor('white');
        grid.clearGrid();
        const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
        if (!pixels.every(value => value === 255) || context.getTransform().a !== originalScale) {
            throw new Error('Background coverage or transform mismatch');
        }
    } finally {
        grid.destroy();
    }
}

function checkBorderRestoration(outlines, border, target, style = 'default') {
    const grids = [];
    function makeGrid(omitTarget) {
        const parent = document.createElement('div');
        const grid = new SquareGrid(3, 3, 7, parent);
        grids.push(grid);
        grid.setAutoRedraw(false);
        grid.setFillStyle(style);
        grid.setAlwaysDrawGrid(outlines);
        grid.setGridColor(border);
        for (let row = 0; row < 3; row++) {
            for (let column = 0; column < 3; column++) {
                if (!omitTarget || row !== target[0] || column !== target[1]) {
                    grid.setCellColor(row, column, 'rgba(255, 0, 0, 0.5)');
                }
            }
        }
        grid.redraw();
        grid.setAutoRedraw(true);
        const canvas = parent.firstChild;
        return {grid, pixels: () => canvas.getContext('2d')
            .getImageData(0, 0, canvas.width, canvas.height).data};
    }
    try {
        const actual = makeGrid(false);
        const expected = makeGrid(true);
        actual.grid.clearCell(...target);
        const reference = expected.pixels();
        const pixels = actual.pixels();
        const mismatch = pixels.findIndex((value, index) => value !== reference[index]);
        if (mismatch !== -1) {
            throw new Error(`Pixel mismatch at byte ${mismatch}: ${pixels[mismatch]} !== ${reference[mismatch]}`);
        }
    } finally {
        grids.forEach(grid => grid.destroy());
    }
}

function checkDrawing(check) {
    const parent = document.createElement('div');
    const grid = new SquareGrid(2, 2, 20, parent);
    const canvas = parent.firstChild;
    const context = canvas.getContext('2d');
    const ratio = context.getTransform().a;
    const pixels = () => context.getImageData(0, 0, canvas.width, canvas.height).data;
    const expect = (condition, message) => {
        if (!condition) throw new Error(message);
    };
    const expectPixel = (x, y, color) => {
        const actual = [...context.getImageData(Math.floor(x * ratio), Math.floor(y * ratio), 1, 1).data];
        expect(actual.join() === color.join(), `Pixel (${x}, ${y}): ${actual} !== ${color}`);
    };
    try {
        check(grid, pixels, expect, expectPixel, context);
    } finally {
        grid.destroy();
    }
}

const drawingChecks = [
    ['setCellColor: paint and replace', (grid, pixels, expect, pixel) => {
        grid.setCellColor(0, 1, 'red');
        pixel(31, 11, [255, 0, 0, 255]);
        pixel(11, 11, [255, 255, 255, 255]);
        grid.setCellColor(0, 1, 'blue');
        pixel(31, 11, [0, 0, 255, 255]);
        expect(grid.getCellColor(0, 1) === 'blue', 'Stored cell color was not updated');
    }],
    ['setCellColor: translucent replacement', (grid, pixels, expect, pixel) => {
        grid.setCellColor(0, 0, 'red');
        grid.setCellColor(0, 0, 'rgba(0, 0, 255, 0.5)');
        const before = pixels();
        grid.redraw();
        expect(pixels().every((value, index) => value === before[index]),
            'Replacing a translucent cell differs from a full redraw');
    }],
    ['clearGrid: clears every cell', (grid, pixels, expect, pixel) => {
        for (let row = 0; row < 2; row++) {
            for (let column = 0; column < 2; column++) grid.setCellColor(row, column, 'red');
        }
        grid.clearGrid();
        expect(pixels().every(value => value === 255), 'Cleared grid is not entirely white');
        for (let row = 0; row < 2; row++) {
            for (let column = 0; column < 2; column++) {
                expect(grid.getCellColor(row, column) === 'white', 'Cell data was not cleared');
            }
        }
    }],
    ['setDefaultColor: preserves explicit cells', (grid, pixels, expect, pixel) => {
        grid.setCellColor(0, 0, 'red');
        grid.setDefaultColor('blue');
        pixel(11, 11, [255, 0, 0, 255]);
        pixel(31, 31, [0, 0, 255, 255]);
    }],
    ['setDefaultColor: transparent background erases old pixels', (grid, pixels, expect, pixel) => {
        grid.setDefaultColor('transparent');
        expect(pixels().every(value => value === 0), 'Transparent background retained old pixels');
    }],
    ['setGridColor: recolors and disables outlines', (grid, pixels, expect, pixel) => {
        grid.setAlwaysDrawGrid(true);
        const black = pixels();
        grid.setGridColor('red');
        const red = pixels();
        expect(red.some((value, index) => value !== black[index]), 'Outline color did not change');
        for (let index = 0; index < red.length; index += 4) {
            expect(red[index] === 255 && red[index + 1] === red[index + 2], 'Unexpected outline color');
        }
        grid.setGridColor(false);
        expect(pixels().every(value => value === 255), 'Disabled outlines remain visible');
    }],
    ['setAlwaysDrawGrid: toggles empty-cell outlines', (grid, pixels, expect, pixel) => {
        grid.setAlwaysDrawGrid(true);
        expect(pixels().some(value => value !== 255), 'Empty-cell outlines were not drawn');
        grid.setAlwaysDrawGrid(false);
        expect(pixels().every(value => value === 255), 'Empty-cell outlines were not removed');
    }]
];

for (const style of ['diamond', 'circle']) {
    drawingChecks.push([`${style}: shape and default-color background`, (grid, pixels, expect, pixel) => {
        expect(grid.getFillStyle() === 'default', 'Initial style changed');
        grid.setGridColor(false);
        grid.setDefaultColor('blue');
        grid.setFillStyle(style);
        grid.setCellColor(0, 0, 'red');
        expect(grid.getFillStyle() === style, 'Style was not stored');
        pixel(11, 11, [255, 0, 0, 255]);
        pixel(3, 3, [0, 0, 255, 255]);
        pixel(31, 31, [0, 0, 255, 255]);
        if (style === 'circle') pixel(7, 7, [255, 0, 0, 255]);
        else {
            const circleCorner = pixels();
            grid.setFillStyle('circle');
            expect(pixels().some((value, index) => value !== circleCorner[index]), 'Diamond and circle are identical');
        }
    }]);
    drawingChecks.push([`${style}: recolor and clear`, (grid, pixels, expect, pixel) => {
        grid.setFillStyle(style);
        grid.setCellColor(0, 0, 'red');
        grid.setCellColor(0, 0, 'rgba(0, 0, 255, 0.5)');
        const before = pixels();
        grid.redraw();
        expect(pixels().every((value, index) => value === before[index]), 'Recolored shape differs from redraw');
        grid.clearCell(0, 0);
        expect(pixels().every(value => value === 255), 'Cleared shape left pixels behind');
        grid.setCellColor(1, 1, 'red');
        grid.clearGrid();
        expect(pixels().every(value => value === 255), 'clearGrid left shapes behind');
    }]);
    drawingChecks.push([`${style}: switching styles preserves colors`, (grid, pixels, expect, pixel) => {
        grid.setGridColor(false);
        grid.setCellColor(0, 0, 'red');
        const original = pixels();
        grid.setFillStyle(style);
        pixel(3, 3, [255, 255, 255, 255]);
        expect(grid.getCellColor(0, 0) === 'red', 'Style changed stored color');
        grid.setDefaultColor('blue');
        pixel(3, 3, [0, 0, 255, 255]);
        pixel(11, 11, [255, 0, 0, 255]);
        grid.setDefaultColor('white');
        grid.setFillStyle('default');
        expect(pixels().every((value, index) => value === original[index]), 'Default fill was not restored');
    }]);
    drawingChecks.push([`${style}: transparent background`, (grid, pixels, expect, pixel) => {
        grid.setGridColor(false);
        grid.setDefaultColor('transparent');
        grid.setFillStyle(style);
        grid.setCellColor(0, 0, 'red');
        pixel(3, 3, [0, 0, 0, 0]);
        pixel(11, 11, [255, 0, 0, 255]);
        grid.clearCell(0, 0);
        expect(pixels().every(value => value === 0), 'Transparent background retained shape pixels');
    }]);
}

for (const style of ['default', 'diamond', 'circle']) {
    drawingChecks.push([`Active cell (${style}): move and remove`, (grid, pixels, expect, pixel) => {
        grid.setFillStyle(style);
        grid.setGridColor(false);
        grid.setCellColor(0, 0, 'red');
        grid.setCellColor(0, 1, 'red');
        grid.redraw();
        const original = pixels();
        expect(grid.getActiveCell() === null, 'A cell is initially active');
        grid.setActiveColor('blue');
        grid.setActiveCell(0, 0);
        pixel(3, 11, [0, 0, 255, 255]);
        pixel(11, 11, [255, 0, 0, 255]);
        const copy = grid.getActiveCell();
        copy.row = 99;
        expect(grid.getActiveCell().row === 0, 'Getter exposed mutable state');
        grid.setActiveCell(0, 1);
        pixel(23, 11, [0, 0, 255, 255]);
        expect(grid.getActiveCell().column === 1, 'Selection did not move');
        const moved = pixels();
        grid.redraw();
        expect(pixels().every((value, index) => value === moved[index]), 'Move differs from full redraw');
        grid.clearActiveCell();
        grid.clearActiveCell();
        expect(grid.getActiveCell() === null, 'Selection was not removed');
        expect(grid.getCellColor(0, 0) === 'red' && grid.getCellColor(0, 1) === 'red', 'Highlight changed cell colors');
        expect(pixels().every((value, index) => value === original[index]), 'Highlight left pixels behind');
    }]);
    drawingChecks.push([`Active cell (${style}): survives color updates and clearing`, (grid, pixels, expect, pixel) => {
        grid.setFillStyle(style);
        grid.setActiveColor('blue');
        grid.setActiveCell(0, 0);
        grid.setCellColor(0, 0, 'red');
        pixel(3, 11, [0, 0, 255, 255]);
        grid.clearCell(0, 1);
        pixel(3, 11, [0, 0, 255, 255]);
        grid.clearCell(0, 0);
        pixel(3, 11, [0, 0, 255, 255]);
        pixel(11, 11, [255, 255, 255, 255]);
        grid.clearGrid();
        pixel(3, 11, [0, 0, 255, 255]);
        expect(grid.getActiveCell().row === 0, 'Clearing colors cleared selection');
        grid.setActiveColor('red');
        pixel(3, 11, [255, 0, 0, 255]);
        expect(grid.getActiveColor() === 'red', 'Highlight color was not stored');
        grid.setDefaultColor('blue');
        grid.setFillStyle(style === 'circle' ? 'diamond' : 'circle');
        pixel(3, 11, [255, 0, 0, 255]);
    }]);
    drawingChecks.push([`Active cell (${style}): deferred updates`, (grid, pixels, expect) => {
        grid.setFillStyle(style);
        const original = pixels();
        grid.setAutoRedraw(false);
        grid.setActiveCell(0, 0);
        grid.setActiveCell(1, 1);
        grid.setActiveColor('blue');
        expect(pixels().every((value, index) => value === original[index]), 'Deferred selection drew immediately');
        grid.redraw();
        const active = pixels();
        expect(active.some((value, index) => value !== original[index]), 'Manual redraw did not show selection');
        grid.clearActiveCell();
        expect(pixels().every((value, index) => value === active[index]), 'Deferred clearing drew immediately');
        grid.redraw();
        expect(pixels().every((value, index) => value === original[index]), 'Manual redraw did not clear selection');
    }]);
}

const deferredChanges = [
    ['setFillStyle', grid => grid.setFillStyle('diamond')],
    ['setCellColor', grid => grid.setCellColor(1, 1, 'blue')],
    ['clearCell', grid => grid.clearCell(0, 0)],
    ['clearGrid', grid => grid.clearGrid()],
    ['setDefaultColor', grid => grid.setDefaultColor('blue')],
    ['setGridColor', grid => grid.setGridColor('blue')],
    ['setAlwaysDrawGrid', grid => grid.setAlwaysDrawGrid(true)]
];
for (const [name, change] of deferredChanges) {
    drawingChecks.push([`${name}: automatic redraw disabled`, (grid, pixels, expect) => {
        grid.setCellColor(0, 0, 'red');
        const before = pixels();
        grid.setAutoRedraw(false);
        change(grid);
        expect(pixels().every((value, index) => value === before[index]), 'Drew while automatic redraw was disabled');
        grid.setAutoRedraw(true);
        expect(pixels().every((value, index) => value === before[index]), 'Enabling automatic redraw unexpectedly drew');
        grid.redraw();
        expect(pixels().some((value, index) => value !== before[index]), 'Manual redraw did not apply the change');
        grid.setCellColor(1, 0, 'blue');
        expect(grid.getAutoRedraw(), 'Automatic redraw was not enabled');
        const after = pixels();
        grid.clearCell(1, 0);
        expect(pixels().some((value, index) => value !== after[index]), 'Automatic redraw did not resume');
    }]);
}

const result = document.querySelector('#result');
let passed = 0;
let failed = 0;
function runCheck(name, check) {
    try {
        check();
        result.append(`PASS: ${name}\n`);
        passed++;
    } catch (error) {
        result.append(`FAIL: ${name} — ${error.message}\n`);
        failed++;
    }
}

// Validation is independent of pixel density: run each input once per setter.
for (const [setter, getter] of [
    ['setCellColor', 'getCellColor'],
    ['setDefaultColor', 'getDefaultColor'],
    ['setGridColor', 'getGridColor']
]) {
    for (const [label, color] of [
        ['unknown name', 'not-a-color'], ['invalid hex', '#gggggg'],
        ['invalid rgb', 'rgb(nope)'], ['whitespace', ' '],
        ['empty string', ''], ['null', null], ['undefined', undefined],
        ['false', false], ['zero', 0], ['NaN', NaN], ['number', 42],
        ['true', true], ['object', {}], ['array', []],
        ['black', '#000000'], ['white', '#ffffff'], ['transparent', 'transparent']
    ]) {
        const validColor = ['black', 'white', 'transparent'].includes(label);
        const disablesGrid = setter === 'setGridColor' && !color;
        const accepts = validColor || disablesGrid;
        runCheck(`${setter}: ${accepts ? 'accepts' : 'rejects'} ${label}`, () => checkDrawing((grid, pixels, expect, pixel, context) => {
            const args = setter === 'setCellColor' ? [0, 0] : [];
            grid[setter](...args, 'red');
            const before = pixels();
            const fillStyle = context.fillStyle;
            let error;
            try {
                grid[setter](...args, color);
            } catch (caught) {
                error = caught;
            }
            if (accepts) {
                expect(!error, `Unexpected rejection: ${error?.message}`);
                expect(Object.is(grid[getter](...args), color), 'Accepted value was not stored');
            } else {
                expect(error instanceof TypeError, 'Expected a TypeError');
                expect(grid[getter](...args) === 'red', 'Rejected input changed stored color');
                expect(pixels().every((value, index) => value === before[index]), 'Rejected input changed rendered pixels');
                expect(context.fillStyle === fillStyle, 'Rejected input changed canvas fill style');
            }
        }));
    }
}

for (const invalid of ['square', '', 'Circle', null, undefined, 42, {}]) {
    runCheck(`setFillStyle: rejects ${String(invalid)}`, () => checkDrawing((grid, pixels, expect) => {
        grid.setCellColor(0, 0, 'red');
        const before = pixels();
        let error;
        try { grid.setFillStyle(invalid); } catch (caught) { error = caught; }
        expect(error instanceof (typeof invalid === 'string' ? RangeError : TypeError), 'Expected validation error');
        expect(grid.getFillStyle() === 'default', 'Rejected style changed state');
        expect(pixels().every((value, index) => value === before[index]), 'Rejected style changed pixels');
    }));
}

for (const [row, column] of [[-1, 0], [0, -1], [2, 0], [0, 2], [0.5, 0], [0, NaN], ['0', 0], [0, undefined]]) {
    runCheck(`setActiveCell: rejects (${String(row)}, ${String(column)})`, () => checkDrawing((grid, pixels, expect) => {
        grid.setActiveCell(0, 0);
        const before = pixels();
        let error;
        try { grid.setActiveCell(row, column); } catch (caught) { error = caught; }
        expect(error instanceof TypeError || error instanceof RangeError, 'Invalid coordinates were accepted');
        expect(grid.getActiveCell().row === 0 && grid.getActiveCell().column === 0, 'Invalid coordinates changed selection');
        expect(pixels().every((value, index) => value === before[index]), 'Invalid coordinates changed pixels');
    }));
}
runCheck('setActiveColor: rejects invalid colors without changing selection', () => checkDrawing((grid, pixels, expect) => {
    grid.setActiveCell(0, 0);
    const before = pixels();
    for (const invalid of ['not-a-color', null, false]) {
        let error;
        try { grid.setActiveColor(invalid); } catch (caught) { error = caught; }
        expect(error instanceof TypeError, 'Invalid highlight color was accepted');
        expect(grid.getActiveColor() === 'orange', 'Invalid color changed highlight color');
        expect(pixels().every((value, index) => value === before[index]), 'Invalid color changed pixels');
    }
}));

const originalRatio = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio');
try {
    for (const ratio of [0.5, 0.8, 1, 1.25, 2]) {
        Object.defineProperty(window, 'devicePixelRatio', {value: ratio, configurable: true});
        runCheck(`Redrawing: ratio=${ratio}`, checkRedrawing);
        for (const [name, check] of drawingChecks) {
            runCheck(`${name}: ratio=${ratio}`, () => checkDrawing(check));
        }
        for (const outlines of [false, true]) {
            for (const border of ['black', 'rgba(0, 0, 0, 0.5)', false]) {
                for (const target of [[0, 0], [1, 1], [2, 2]]) {
                    for (const style of ['default', 'diamond', 'circle']) {
                        runCheck(
                            `Border restoration: style=${style}, ratio=${ratio}, outlines=${outlines}, border=${border}, cell=${target}`,
                            () => checkBorderRestoration(outlines, border, target, style)
                        );
                    }
                }
            }
        }
    }
} finally {
    if (originalRatio) {
        Object.defineProperty(window, 'devicePixelRatio', originalRatio);
    } else {
        delete window.devicePixelRatio;
    }
}
result.prepend(`${passed} passed, ${failed} failed\n\n`);
</script>
